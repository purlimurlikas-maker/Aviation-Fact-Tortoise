<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aviation Tortoise</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body background="https://i.pinimg.com/736x/2c/9a/e6/2c9ae69ee2926b9b16e5cf808d5eaf20.jpg">
    <header class="hero">
      <h1>Aviation Tortoise</h1>
      <p class="tagline">press for a random aviation fact</p>
    </header>
    <main>
      <section class="fact-card">
         <div class="tortoise" id="tortoise">
          <img class="scene" src="" alt="an aviation turtle" />
        </div>
        <button id="press">press the Aviation Tortoise</button>
        <p class="message" id="message">press the button for the Aviation Tortoise to tell you a random fact about aviation</p>
      </section>
    </main>
    <footer>
      <p>made by Purli, booking a flight</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
